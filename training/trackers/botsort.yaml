# Local FRC defaults. Keep lost tracks alive long enough for the appearance memory to bridge a
# robot leaving the camera for roughly one to five seconds.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 300
match_thresh: 0.8
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.8
# Native BoT-SORT ReID improves the quality and length of raw tracklets. The frame-level custom
# identity layer still validates motion, edge re-entry, alliance compatibility and ambiguity.
with_reid: True
model: auto
